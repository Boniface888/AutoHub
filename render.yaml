services:
  - type: web
    name: autohub-marketplace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm --prefix client ci --include=dev && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
